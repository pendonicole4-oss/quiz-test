<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cosmic Quiz — A little trip through space</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f3ff;
      --surface: #fff;
      --ink: #202044;
      --muted: #71718e;
      --line: #e8e7f2;
      --purple: #7057e8;
      --purple-dark: #5942ce;
      --purple-soft: #f0edff;
      --green: #16834b;
      --green-bg: #e7f8ee;
      --red: #c83f50;
      --red-bg: #fff0f1;
      --shadow: 0 22px 70px rgb(50 38 112 / 11%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111120;
        --surface: #1c1b30;
        --ink: #f2f0ff;
        --muted: #aaa8c4;
        --line: #34324c;
        --purple: #a393ff;
        --purple-dark: #c4baff;
        --purple-soft: #2a2648;
        --green: #6ce09b;
        --green-bg: #173a2a;
        --red: #ff8791;
        --red-bg: #48242c;
        --shadow: 0 22px 70px rgb(0 0 0 / 30%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgb(129 108 238 / 12%), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgb(255 160 195 / 12%), transparent 28%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .app { width: min(100%, 550px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #947fff, #674be0);
      box-shadow: 0 5px 15px rgb(112 87 232 / 28%);
      font-size: 17px;
    }

    .card {
      overflow: hidden;
      padding: clamp(23px, 6vw, 38px);
      border: 1px solid rgb(120 110 170 / 10%);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      margin-bottom: 29px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8d76ff, #6550df);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 30px);
      letter-spacing: -.045em;
      line-height: 1.2;
    }

    .prompt {
      min-height: 70px;
      margin: 12px 0 23px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--purple);
      background: var(--purple-soft);
    }

    .answer:focus-visible, .action:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--purple) 45%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--bg);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-bg);
      animation: pop .35s ease both;
    }

    .answer.correct .answer-letter {
      color: #fff;
      background: var(--green);
    }

    .answer.wrong {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-bg);
      animation: shake .42s ease both;
    }

    .answer.wrong .answer-letter {
      color: #fff;
      background: var(--red);
    }

    .feedback {
      min-height: 26px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 13px;
    }

    .action {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #8069f4, #6249dd);
      box-shadow: 0 7px 17px rgb(112 87 232 / 23%);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgb(112 87 232 / 30%);
    }

    .action:active { transform: translateY(0); }
    .action[hidden] { display: none; }

    .results {
      padding: 18px 0 6px;
      text-align: center;
      animation: rise .5s ease both;
    }

    .reaction {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--purple-soft);
      font-size: 50px;
      animation: float 2.8s ease-in-out infinite;
    }

    .results h1 { margin: 7px 0 10px; }

    .result-copy {
      max-width: 340px;
      margin: 0 auto 22px;
      color: var(--muted);
    }

    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 25px;
      color: var(--purple);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -.05em;
    }

    .final-score span {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .results .action { margin: 0 auto; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes pop {
      0% { transform: scale(.98); }
      55% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @media (max-width: 420px) {
      body { padding: 22px 13px; }
      .card { border-radius: 21px; }
      .prompt { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Little Orbit Quiz</p>
    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score" aria-live="polite"><span aria-hidden="true">★</span> Score: <span id="score">0</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress"></div>
        </div>
        <p class="eyebrow">Mission briefing</p>
        <h1>Space exploration</h1>
        <p class="prompt" id="question" aria-live="polite"></p>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="footer">
          <button class="action" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="results" id="results" hidden></div>
    </section>
  </main>

  <script>
    (() => {
      const questions = [
        { text: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1, fact: "Mars gets its rusty colour from iron-rich dust." },
        { text: "What was the first human-made object to reach space?", options: ["Sputnik 1", "V-2 rocket", "Apollo 11", "Explorer 1"], answer: 1, fact: "A German V-2 rocket crossed into space in 1944." },
        { text: "Which planet has the most prominent ring system?", options: ["Neptune", "Uranus", "Saturn", "Jupiter"], answer: 2, fact: "Saturn's rings are made mostly of ice and rocky debris." },
        { text: "What is the name of the galaxy that contains our Solar System?", options: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"], answer: 3, fact: "Our Solar System lives in the Milky Way's Orion Arm." },
        { text: "Who was the first person to walk on the Moon?", options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Michael Collins"], answer: 2, fact: "Neil Armstrong stepped onto the lunar surface in 1969." },
        { text: "Which is the largest planet in our Solar System?", options: ["Saturn", "Jupiter", "Earth", "Neptune"], answer: 1, fact: "Jupiter is so massive that more than 1,300 Earths could fit inside it." },
        { text: "What do astronauts wear to protect themselves outside a spacecraft?", options: ["Pressure suit", "Flight jacket", "Thermal blanket", "Parachute suit"], answer: 0, fact: "A spacesuit provides oxygen, pressure, and temperature control." },
        { text: "Which spacecraft carried the first humans to the Moon?", options: ["Gemini 8", "Apollo 11", "Voyager 1", "Artemis I"], answer: 1, fact: "Apollo 11 landed on the Moon on July 20, 1969." },
        { text: "What is the closest star to Earth?", options: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"], answer: 2, fact: "The Sun is about 150 million kilometres from Earth." },
        { text: "What force keeps planets in orbit around the Sun?", options: ["Magnetism", "Friction", "Gravity", "Solar wind"], answer: 2, fact: "Gravity holds our Solar System together and guides planetary orbits." }
      ];

      const questionEl = document.querySelector("#question");
      const answersEl = document.querySelector("#answers");
      const feedbackEl = document.querySelector("#feedback");
      const scoreEl = document.querySelector("#score");
      const countEl = document.querySelector("#question-count");
      const progressEl = document.querySelector("#progress");
      const progressTrack = document.querySelector(".progress-track");
      const nextButton = document.querySelector("#next");
      const quizEl = document.querySelector("#quiz");
      const resultsEl = document.querySelector("#results");
      let current = 0;
      let score = 0;
      let locked = false;

      function renderQuestion() {
        locked = false;
        const item = questions[current];
        countEl.textContent = `Question ${current + 1} of ${questions.length}`;
        progressEl.style.width = `${(current / questions.length) * 100}%`;
        progressTrack.setAttribute("aria-valuenow", String(current));
        questionEl.textContent = item.text;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        nextButton.hidden = true;
        nextButton.innerHTML = current === questions.length - 1
          ? 'See my results <span aria-hidden="true">→</span>'
          : 'Next question <span aria-hidden="true">→</span>';
        answersEl.replaceChildren(...item.options.map((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.index = String(index);
          const letter = document.createElement("span");
          letter.className = "answer-letter";
          letter.setAttribute("aria-hidden", "true");
          letter.textContent = String.fromCharCode(65 + index);
          const label = document.createElement("span");
          label.textContent = option;
          button.append(letter, label);
          button.addEventListener("click", () => chooseAnswer(index));
          return button;
        }));
      }

      function chooseAnswer(selected) {
        if (locked) return;
        locked = true;
        const item = questions[current];
        const buttons = [...answersEl.querySelectorAll(".answer")];
        buttons.forEach(button => { button.disabled = true; });
        if (selected === item.answer) {
          score += 1;
          scoreEl.textContent = String(score);
          buttons[selected].classList.add("correct");
          feedbackEl.textContent = `Brilliant! ${item.fact}`;
          feedbackEl.classList.add("good");
        } else {
          buttons[selected].classList.add("wrong");
          buttons[item.answer].classList.add("correct");
          feedbackEl.textContent = `Not quite — ${item.fact}`;
          feedbackEl.classList.add("bad");
        }
        nextButton.hidden = false;
        nextButton.focus({ preventScroll: true });
      }

      function showResults() {
        quizEl.hidden = true;
        resultsEl.hidden = false;
        progressEl.style.width = "100%";
        progressTrack.setAttribute("aria-valuenow", String(questions.length));
        const percent = score / questions.length;
        const reaction = percent === 1 ? "🚀" : percent >= .7 ? "🌟" : percent >= .4 ? "🪐" : "🌱";
        const heading = percent === 1 ? "Out of this world!" : percent >= .7 ? "Stellar work!" : percent >= .4 ? "Nice exploring!" : "Mission complete!";
        const message = percent === 1
          ? "A perfect flight! You really know your way around the cosmos."
          : percent >= .7
            ? "You have some serious space smarts. The stars are within reach!"
            : percent >= .4
              ? "A lovely voyage through the cosmos. There is always more to discover!"
              : "Every great explorer starts somewhere. Ready for another orbit?";
        resultsEl.innerHTML = `
          <div class="reaction" role="img" aria-label="${heading}">${reaction}</div>
          <p class="eyebrow">Mission complete</p>
          <h1>${heading}</h1>
          <p class="result-copy">${message}</p>
          <div class="final-score">${score}<span> / ${questions.length} correct</span></div>
          <br>
          <button class="action" id="restart" type="button">Explore again <span aria-hidden="true">↻</span></button>
        `;
        resultsEl.querySelector("#restart").addEventListener("click", restart);
        resultsEl.querySelector("#restart").focus({ preventScroll: true });
      }

      function restart() {
        current = 0;
        score = 0;
        scoreEl.textContent = "0";
        resultsEl.hidden = true;
        quizEl.hidden = false;
        renderQuestion();
      }

      nextButton.addEventListener("click", () => {
        if (current === questions.length - 1) {
          showResults();
          return;
        }
        current += 1;
        renderQuestion();
      });

      renderQuestion();
    })();
  </script>
</body>
</html>
